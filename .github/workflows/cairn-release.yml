name: Cairn release

# A Cairn release is a bare X.Y.Z tag on master. The mod is built by the project's own service, against game assemblies it keeps behind a login,
# so the pack is made from the DLL the project publishes on its releases and MelonLoader's release, both checked against pinned sha256s
# (.github/cairn/Build-Pack.ps1). The pack, pack-index.json and game.json are published: the Cairn launcher reads the index to install and
# update this mod. RELEASE_CHANNEL=beta publishes a pre-release (only players who chose beta are offered it).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: The tag must be on master and equal VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin master
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "tag $env:GITHUB_REF_NAME is not on master" }
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME is not VERSION ($v)" }

      - name: Get the mod and MelonLoader the pack is made from
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dl | Out-Null
          gh release download Beta_0.3.9 -R pyeight/SlimeRancher2Multiplayer -p SR2MP.dll -D dl
          gh release download v0.7.3 -R LavaGang/MelonLoader -p MelonLoader.x64.zip -D dl
          $mod = (Get-FileHash dl/SR2MP.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $ml = (Get-FileHash dl/MelonLoader.x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SR2MP.dll Beta_0.3.9 sha256 $mod"
          Write-Host "MelonLoader.x64.zip v0.7.3 sha256 $ml"
          if ($mod -ne '9cf2823c635e0d4e515828b14a50e8b42442f45bfb31e175f6a80984f437ea28') { throw "the mod is not the one this pack was made with ($mod)" }
          if ($ml -ne '5b2b2f3d1cd42b59ec886c5bdc2663edae87a0097a4f4a8f58c0965a99dda416') { throw "MelonLoader is not the one this pack was made with ($ml)" }

      - name: Build the pack
        shell: pwsh
        run: ./.github/cairn/Build-Pack.ps1 -MelonLoaderZip dl/MelonLoader.x64.zip -ModDll dl/SR2MP.dll -UpstreamVersion 0.3.9

      - name: Changelog
        shell: pwsh
        run: ./.github/cairn/New-ReleaseNotes.ps1 -OutFile notes.md -Tag $env:GITHUB_REF_NAME

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-pack
          path: |
            release/Cairn-Pack-slime-rancher-2-*.zip
            release/pack-index.json
            .github/cairn/game/game.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("release/Cairn-Pack-slime-rancher-2-$env:GITHUB_REF_NAME.zip", 'release/pack-index.json') + (Get-ChildItem .github/cairn/game -File | ForEach-Object { $_.FullName })
          $flags = @()
          if ((Get-Content RELEASE_CHANNEL -Raw).Trim() -eq 'beta') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @assets --title $env:GITHUB_REF_NAME --notes-file notes.md --verify-tag @flags
